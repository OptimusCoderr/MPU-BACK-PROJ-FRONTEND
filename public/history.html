<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SpineGuard — History</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script>var API="https://YOUR-BACKEND-URL.vercel.app";</script>
<style>
:root{--bg:#08090f;--bg2:#10121a;--bg3:#181b26;--bg4:#1e2230;
  --border:rgba(255,255,255,.07);--border-hi:rgba(255,255,255,.14);
  --text:#e4e8f0;--muted:#4e5668;
  --good:#1ec98a;--bad:#f0504a;--accent:#3d9eff;
  --fh:'Syne',sans-serif;--fm:'JetBrains Mono',monospace;}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:var(--fh);min-height:100vh}
body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background-image:linear-gradient(rgba(61,158,255,.02) 1px,transparent 1px),linear-gradient(90deg,rgba(61,158,255,.02) 1px,transparent 1px);
  background-size:44px 44px}
.wrap{position:relative;z-index:1;max-width:1100px;margin:0 auto;padding:20px 24px 48px}
.topbar{display:flex;align-items:center;justify-content:space-between;padding-bottom:14px;margin-bottom:24px;border-bottom:1px solid var(--border)}
.logo{font-size:16px;font-weight:800;letter-spacing:.14em;text-transform:uppercase}
.logo span{color:var(--accent)}
.nav-link{font-family:var(--fm);font-size:10px;letter-spacing:.1em;padding:4px 12px;border-radius:20px;border:1px solid var(--border);color:var(--muted);text-decoration:none;transition:all .2s;text-transform:uppercase}
.nav-link:hover{color:var(--accent);border-color:rgba(61,158,255,.3)}
.page-title{font-size:22px;font-weight:800;margin-bottom:6px}
.page-sub{font-size:12px;color:var(--muted);font-family:var(--fm);margin-bottom:24px}

/* FILTERS */
.filters{display:flex;gap:10px;margin-bottom:20px;flex-wrap:wrap;align-items:center}
.filter-sel{background:var(--bg2);border:1px solid var(--border-hi);color:var(--text);
  font-family:var(--fm);font-size:11px;padding:7px 12px;border-radius:8px;cursor:pointer;outline:none}
.filter-sel:focus{border-color:var(--accent)}
.filter-btn{padding:7px 16px;border-radius:8px;border:1px solid var(--border-hi);
  background:var(--bg2);color:var(--muted);font-family:var(--fm);font-size:11px;cursor:pointer;transition:all .15s}
.filter-btn:hover{color:var(--text);border-color:rgba(255,255,255,.2)}
.filter-btn.active{background:rgba(61,158,255,.13);color:var(--accent);border-color:rgba(61,158,255,.4)}

/* STATS BAR */
.stats-bar{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:24px}
.stat-box{background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:14px 16px}
.stat-box-lbl{font-size:9px;font-family:var(--fm);color:var(--muted);letter-spacing:.12em;text-transform:uppercase;margin-bottom:6px}
.stat-box-val{font-size:26px;font-weight:800;font-family:var(--fm);line-height:1}

/* SESSION CARDS */
.sessions-grid{display:flex;flex-direction:column;gap:10px}
.sess-card{background:var(--bg2);border:1px solid var(--border);border-radius:14px;
  padding:16px 20px;cursor:pointer;transition:border-color .2s}
.sess-card:hover{border-color:var(--border-hi)}
.sess-card.open{border-color:rgba(61,158,255,.3)}
.sess-top{display:flex;align-items:center;gap:16px}
.sess-date{font-family:var(--fm);font-size:11px;color:var(--muted);letter-spacing:.06em;min-width:90px}
.sess-patient{font-size:14px;font-weight:700;flex:1}
.sess-dur{font-family:var(--fm);font-size:11px;color:var(--muted)}
.sess-score{font-family:var(--fm);font-size:20px;font-weight:700}
.status-pill{font-family:var(--fm);font-size:9px;letter-spacing:.1em;padding:3px 10px;border-radius:20px;text-transform:uppercase}
.status-pill.Completed{background:rgba(30,201,138,.12);color:var(--good)}
.status-pill.Manual-Stop{background:rgba(240,80,74,.12);color:var(--bad)}
.status-pill.In-Progress{background:rgba(61,158,255,.12);color:var(--accent)}
.chevron{color:var(--muted);transition:transform .2s;font-size:12px}
.sess-card.open .chevron{transform:rotate(180deg)}

.sess-detail{display:none;margin-top:14px;padding-top:14px;border-top:1px solid var(--border)}
.sess-card.open .sess-detail{display:block}
.detail-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
.detail-box{background:var(--bg3);border-radius:8px;padding:10px 12px}
.detail-lbl{font-size:9px;font-family:var(--fm);color:var(--muted);letter-spacing:.1em;text-transform:uppercase;margin-bottom:3px}
.detail-val{font-size:16px;font-weight:600;font-family:var(--fm)}

/* Comments in session */
.cmt-list{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.cmt-item{background:var(--bg3);border-radius:8px;padding:10px 12px;
  display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.cmt-body{flex:1}
.cmt-doctor{font-size:10px;font-family:var(--fm);color:var(--accent);letter-spacing:.06em;margin-bottom:3px}
.cmt-text{font-size:13px;color:var(--text);line-height:1.5}
.cmt-date{font-size:10px;font-family:var(--fm);color:var(--muted);white-space:nowrap}
.del-btn{background:none;border:none;color:var(--muted);cursor:pointer;font-size:14px;padding:2px 6px;border-radius:4px;transition:color .15s}
.del-btn:hover{color:var(--bad)}

/* Add comment inline */
.inline-comment{display:flex;gap:8px;margin-top:10px}
.inline-comment input{flex:1;background:var(--bg);border:1px solid var(--border-hi);color:var(--text);
  font-family:var(--fm);font-size:12px;padding:8px 10px;border-radius:8px;outline:none;transition:border-color .2s}
.inline-comment input:focus{border-color:var(--accent)}
.inline-comment input::placeholder{color:var(--muted)}
.post-btn{padding:8px 14px;border-radius:8px;border:1px solid rgba(61,158,255,.3);
  background:rgba(61,158,255,.1);color:var(--accent);font-family:var(--fm);
  font-size:11px;cursor:pointer;white-space:nowrap;transition:all .15s}
.post-btn:hover{background:rgba(61,158,255,.2)}

.empty{text-align:center;padding:48px 24px;color:var(--muted);font-family:var(--fm);font-size:13px;letter-spacing:.06em}
.loading{text-align:center;padding:32px;color:var(--muted);font-family:var(--fm);font-size:12px;letter-spacing:.08em;animation:pulse-txt 1.5s ease-in-out infinite}
@keyframes pulse-txt{0%,100%{opacity:.5}50%{opacity:1}}
.del-sess-btn{font-family:var(--fm);font-size:10px;color:var(--bad);background:none;border:1px solid rgba(240,80,74,.3);
  border-radius:6px;padding:4px 10px;cursor:pointer;transition:all .15s}
.del-sess-btn:hover{background:rgba(240,80,74,.1)}
</style>
</head>
<body>
<div class="wrap">
<header class="topbar">
  <div class="logo">Spine<span>Guard</span> <span style="color:var(--muted);font-weight:600;font-size:13px">History</span></div>
  <div style="display:flex;gap:8px;align-items:center">
    <a class="nav-link" href="index.html">← Dashboard</a>
    <a class="nav-link" href="api.html">⚡ API Docs</a>
  </div>
</header>

<div class="page-title">Session History</div>
<div class="page-sub">All sessions, comments, and posture records.</div>

<!-- FILTERS -->
<div class="filters">
  <select class="filter-sel" id="f-patient" onchange="loadHistory()"><option value="">All Patients</option></select>
  <button class="filter-btn active" data-s="" onclick="setStatus(this,'')">All</button>
  <button class="filter-btn" data-s="Completed" onclick="setStatus(this,'Completed')">Completed</button>
  <button class="filter-btn" data-s="Manual Stop" onclick="setStatus(this,'Manual Stop')">Manual Stop</button>
  <button class="filter-btn" data-s="In Progress" onclick="setStatus(this,'In Progress')">In Progress</button>
  <span style="flex:1"></span>
  <button class="filter-btn" onclick="loadHistory()" style="border-color:rgba(30,201,138,.3);color:var(--good)">↺ Refresh</button>
</div>

<!-- SUMMARY STATS -->
<div class="stats-bar" id="stats-bar">
  <div class="stat-box"><div class="stat-box-lbl">Total Sessions</div><div class="stat-box-val" id="st-total" style="color:var(--accent)">—</div></div>
  <div class="stat-box"><div class="stat-box-lbl">Avg Score</div><div class="stat-box-val" id="st-score" style="color:var(--good)">—</div></div>
  <div class="stat-box"><div class="stat-box-lbl">Avg Slouches</div><div class="stat-box-val" id="st-slouch" style="color:var(--bad)">—</div></div>
  <div class="stat-box"><div class="stat-box-lbl">Completed</div><div class="stat-box-val" id="st-comp" style="color:var(--good)">—</div></div>
</div>

<!-- SESSION LIST -->
<div class="sessions-grid" id="sessions-grid"><div class="loading">Loading sessions...</div></div>
</div>

<script>
function api(path,opts){return fetch(API.replace(/\/$/,"")+path,opts).then(function(r){return r.json();});}
function fmt(s){s=Math.max(0,Math.floor(s));var h=Math.floor(s/3600),m=Math.floor((s%3600)/60),sec=s%60;return h>0?h+":"+pad(m)+":"+pad(sec):m+":"+pad(sec);}
function pad(n){return String(n).padStart(2,"0");}
function scoreCol(s){return s>=80?"var(--good)":s>=50?"var(--accent)":"var(--bad)";}

var filterStatus = "";

function setStatus(btn, s){
  filterStatus = s;
  document.querySelectorAll(".filter-btn[data-s]").forEach(function(b){b.classList.toggle("active",b.dataset.s===s);});
  loadHistory();
}

async function loadHistory(){
  var grid = document.getElementById("sessions-grid");
  grid.innerHTML = '<div class="loading">Loading...</div>';
  try{
    // Load patients for filter
    var pd = await api("/api/patients");
    var patients = pd.data||[];
    var fPat = document.getElementById("f-patient");
    var cur = fPat.value;
    fPat.innerHTML = '<option value="">All Patients</option>' +
      patients.map(function(p){return'<option value="'+p.patientId+'"'+( cur===p.patientId?' selected':'')+'>'+p.name+'</option>';}).join("");

    var qs = "?limit=50";
    if(filterStatus) qs += "&status="+encodeURIComponent(filterStatus);
    if(fPat.value)    qs += "&patientId="+encodeURIComponent(fPat.value);
    var sd = await api("/api/sessions"+qs);
    var sessions = sd.data||[];

    // Summary stats
    document.getElementById("st-total").textContent = sessions.length;
    var avgScore  = sessions.length ? Math.round(sessions.reduce(function(a,s){return a+s.score;},0)/sessions.length) : 0;
    var avgSlouch = sessions.length ? Math.round(sessions.reduce(function(a,s){return a+s.slouchCount;},0)/sessions.length) : 0;
    var completed = sessions.filter(function(s){return s.status==="Completed";}).length;
    document.getElementById("st-score").textContent  = sessions.length ? avgScore+"%" : "—";
    document.getElementById("st-slouch").textContent = sessions.length ? avgSlouch : "—";
    document.getElementById("st-comp").textContent   = completed;

    if(!sessions.length){grid.innerHTML='<div class="empty">No sessions found.</div>';return;}

    grid.innerHTML = sessions.map(function(s){
      var pill = s.status.replace(" ","-");
      return '<div class="sess-card" id="sc-'+s._id+'" onclick="toggleCard(\''+s._id+'\')">'+
        '<div class="sess-top">'+
          '<div class="sess-date">'+s.date+'</div>'+
          '<div class="sess-patient">'+s.patientId+'</div>'+
          '<div class="sess-dur">'+(s.duration||"—")+'</div>'+
          '<div class="sess-score" style="color:'+scoreCol(s.score)+'">'+s.score+'%</div>'+
          '<span class="status-pill '+pill+'">'+s.status+'</span>'+
          '<span class="chevron">▾</span>'+
        '</div>'+
        '<div class="sess-detail" id="sd-'+s._id+'">'+
          '<div class="detail-grid">'+
            '<div class="detail-box"><div class="detail-lbl">Good Time</div><div class="detail-val" style="color:var(--good)">'+fmt(s.goodSeconds||0)+'</div></div>'+
            '<div class="detail-box"><div class="detail-lbl">Slouch Time</div><div class="detail-val" style="color:var(--bad)">'+fmt(s.badSeconds||0)+'</div></div>'+
            '<div class="detail-box"><div class="detail-lbl">Slouch Events</div><div class="detail-val" style="color:var(--bad)">'+(s.slouchCount||0)+'</div></div>'+
            '<div class="detail-box"><div class="detail-lbl">Peak Pitch</div><div class="detail-val">'+(s.peakPitch||0).toFixed(1)+'°</div></div>'+
          '</div>'+
          (s.notes?'<div style="font-size:12px;color:var(--muted);font-family:var(--fm);margin-bottom:10px">📝 '+s.notes+'</div>':'')+
          '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">'+
            '<div style="font-size:9px;font-family:var(--fm);color:var(--muted);letter-spacing:.12em;text-transform:uppercase">Doctor Comments</div>'+
            '<button class="del-sess-btn" onclick="deleteSession(event,\''+s._id+'\')">Delete Session</button>'+
          '</div>'+
          '<div class="cmt-list" id="cl-'+s._id+'"><div style="color:var(--muted);font-family:var(--fm);font-size:11px">Loading...</div></div>'+
          '<div class="inline-comment" style="margin-top:10px">'+
            '<input id="ci-'+s._id+'" placeholder="Dr. Adeyemi: Write a comment..." maxlength="300">'+
            '<button class="post-btn" onclick="postInlineComment(event,\''+s._id+'\',\''+s.patientId+'\')">Post</button>'+
          '</div>'+
        '</div>'+
      '</div>';
    }).join("");
  }catch(e){grid.innerHTML='<div class="empty">Error loading sessions. Check your API URL.</div>';}
}

async function toggleCard(id){
  var card = document.getElementById("sc-"+id);
  var wasOpen = card.classList.contains("open");
  document.querySelectorAll(".sess-card.open").forEach(function(c){c.classList.remove("open");});
  if(!wasOpen){
    card.classList.add("open");
    loadComments(id);
  }
}

async function loadComments(sessionId){
  var list = document.getElementById("cl-"+sessionId);
  if(!list)return;
  try{
    // Get session patientId
    var card = document.getElementById("sc-"+sessionId);
    var patientId = card ? card.querySelector(".sess-patient").textContent : "";
    var d = await api("/api/comments?patientId="+encodeURIComponent(patientId));
    var arr = d.data||[];
    if(!arr.length){list.innerHTML='<div style="color:var(--muted);font-family:var(--fm);font-size:11px;padding:6px 0">No comments yet.</div>';return;}
    list.innerHTML = arr.map(function(c){
      return '<div class="cmt-item">'+
        '<div class="cmt-body">'+
          '<div class="cmt-doctor">'+c.doctor+'</div>'+
          '<div class="cmt-text">'+c.text+'</div>'+
        '</div>'+
        '<div style="display:flex;flex-direction:column;align-items:flex-end;gap:4px">'+
          '<div class="cmt-date">'+c.date+'</div>'+
          '<button class="del-btn" onclick="deleteComment(event,\''+c._id+'\',\''+sessionId+'\')">✕</button>'+
        '</div>'+
      '</div>';
    }).join("");
  }catch(e){list.innerHTML='<div style="color:var(--bad);font-family:var(--fm);font-size:11px">Failed to load comments.</div>';}
}

async function postInlineComment(e, sessionId, patientId){
  e.stopPropagation();
  var inp = document.getElementById("ci-"+sessionId);
  var raw = inp.value.trim();
  if(!raw)return;
  // Parse "Dr. Name: text" or just "text"
  var doctor = "Dr. Adeyemi", text = raw;
  var m = raw.match(/^([^:]{2,40}):\s*(.+)$/);
  if(m){doctor=m[1].trim();text=m[2].trim();}
  try{
    await api("/api/comments",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({doctor:doctor,text:text,patientId:patientId})});
    inp.value="";
    loadComments(sessionId);
  }catch(e){alert("Failed to post comment");}
}

async function deleteComment(e, commentId, sessionId){
  e.stopPropagation();
  if(!confirm("Delete this comment?"))return;
  try{
    await api("/api/comments/"+commentId,{method:"DELETE"});
    loadComments(sessionId);
  }catch(e){alert("Failed to delete");}
}

async function deleteSession(e, sessionId){
  e.stopPropagation();
  if(!confirm("Delete this session and all its readings? This cannot be undone."))return;
  try{
    var d = await api("/api/sessions/"+sessionId,{method:"DELETE"});
    if(d.error){alert(d.error);return;}
    loadHistory();
  }catch(e){alert("Failed to delete session");}
}

loadHistory();
setInterval(loadHistory, 30000);
</script>
</body>
</html>
